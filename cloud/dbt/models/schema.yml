version: 2
sources:
  - name: silver
    database: "{{ env_var('RUGBY_DATABRICKS_CATALOG', 'workspace') }}"
    schema: "{{ env_var('RUGBY_DATABRICKS_SCHEMA', 'rugby_analytics') }}"
    tables:
      - name: silver_match_versions
      - name: silver_player_versions
      - name: silver_scoring_versions
models:
  - name: stg_latest_matches
    description: Latest validated version of each fixture.
    columns:
      - name: match_id
        tests: [not_null, unique]
      - name: home_team
        tests: [not_null]
      - name: away_team
        tests: [not_null]
  - name: dim_team
    columns:
      - name: team_id
        tests: [not_null, unique]
      - name: team_name
        tests: [not_null, unique]
  - name: fact_match
    columns:
      - name: match_id
        tests: [not_null, unique]
      - name: home_team_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_id
      - name: away_team_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_id
  - name: team_season
    columns:
      - name: season
        tests: [not_null]
      - name: team_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_id
  - name: player_scoring
    description: Points from listed scoring events; source event detail can be incomplete.
    columns:
      - name: season
        tests: [not_null]
      - name: team_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_id
      - name: player
        tests: [not_null]

