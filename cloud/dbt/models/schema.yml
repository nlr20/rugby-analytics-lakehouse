version: 2
sources:
  - name: silver
    database: "{{ env_var('RUGBY_DATABRICKS_CATALOG', 'workspace') }}"
    schema: "{{ env_var('RUGBY_DATABRICKS_SCHEMA', 'rugby_analytics') }}"
    tables:
      - name: silver_match_versions
      - name: silver_player_versions
      - name: silver_scoring_versions
      - name: silver_fixture_versions
      - name: silver_season_snapshots
models:
  - name: stg_current_fixtures
    columns:
      - name: match_id
        tests: [not_null, unique]
      - name: season
        tests: [not_null]
      - name: status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['completed', 'result_unavailable']
  - name: stg_latest_matches
    description: Completed match version referenced by the current snapshot for its season.
    columns:
      - name: match_id
        tests: [not_null, unique]
      - name: home_team
        tests: [not_null]
      - name: away_team
        tests: [not_null]
  - name: dim_team
    columns:
      - name: team_id
        tests: [not_null, unique]
      - name: team_name
        tests: [not_null, unique]
  - name: fact_match
    columns:
      - name: match_id
        tests: [not_null, unique]
      - name: home_team_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_team')
                field: team_id
      - name: away_team_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_team')
                field: team_id
  - name: team_season
    columns:
      - name: season
        tests: [not_null]
      - name: team_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_team')
                field: team_id
  - name: team_match
    description: One team appearance per completed match, with venue and result from that team's perspective.
    columns:
      - name: match_team_key
        tests: [not_null, unique]
      - name: team_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_team')
                field: team_id
      - name: venue
        tests:
          - accepted_values:
              arguments:
                values: ['Home', 'Away']
      - name: result
        tests:
          - accepted_values:
              arguments:
                values: ['Win', 'Draw', 'Loss']
  - name: player_scoring
    description: Points from listed scoring events; source event detail can be incomplete.
    columns:
      - name: season
        tests: [not_null]
      - name: team_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_team')
                field: team_id
      - name: player
        tests: [not_null]
  - name: scoring_event
    description: Listed scoring attempts and scores for the current completed match versions, including missed kicks.
    columns:
      - name: event_id
        tests: [not_null, unique]
      - name: match_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fact_match')
                field: match_id
      - name: team_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_team')
                field: team_id
      - name: minute
        tests: [not_null]
      - name: points
        tests: [not_null]
  - name: fixture_schedule
    description: Current published snapshot of completed fixtures and fixtures whose results are unavailable in the source.
    columns:
      - name: match_id
        tests: [not_null, unique]
      - name: season
        tests: [not_null]

