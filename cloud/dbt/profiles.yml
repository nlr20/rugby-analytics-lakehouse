rugby_analytics:
  target: free_edition
  outputs:
    free_edition:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      auth_type: oauth
      catalog: "{{ env_var('RUGBY_DATABRICKS_CATALOG', 'workspace') }}"
      schema: rugby_dbt
      threads: 2
    airflow:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      catalog: "{{ env_var('RUGBY_DATABRICKS_CATALOG', 'workspace') }}"
      schema: rugby_dbt
      threads: 2
