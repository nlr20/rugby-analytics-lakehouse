[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rugby-analytics-lakehouse"
version = "0.1.0"
description = "Incremental rugby union analytics pipeline"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
site-export = ["databricks-sql-connector>=4,<5", "databricks-sdk>=0.117,<1"]

[project.scripts]
rugby-lakehouse = "rugby_lakehouse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

